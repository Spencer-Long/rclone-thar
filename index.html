<h1>rclone thar</h1>
<p>rclone thar is a private Google sign-in app used only by its owner. It lets rclone, the open-source file tool (rclone.org), list and copy Google Drive files that the owner already has access to, onto a computer the owner works on.</p>
<p>It is not offered to anyone else. <a href="privacy.html">Privacy policy</a></p>
